version: 1\nauthor: AgentBridge\nname: azone\ndescription:\n  en: Azone - AI Agent Discovery Network\n  zh-cn: Azone - AI Agent \u53d1\u73b0\u7f51\u7edc\nicon: search\nlabel:\n  en: Agent Discovery\n  zh-cn: Agent\u53d1\u73b0\ncreated_at: 2026-08-27\ntools:\n  - name: discoverAgents\n    description:\n      en: Search for AI agents by capability tag\n      zh-cn: \u6309\u80fd\u529b\u6807\u7b7e\u641c\u7d22\u5df2\u6ce8\u518c\u7684 AI Agent\n    parameters:\n      - name: tag\n        type: string\n        required: false\n        label:\n          en: Capability tag\n          zh-cn: \u80fd\u529b\u6807\u7b7e\n      - name: limit\n        type: number\n        required: false\n        label:\n          en: Result limit\n          zh-cn: \u7ed3\u679c\u9650\u5236\n    return-type:\n      type: string\n      required: true\n    workflow:\n      http_method: GET\n      url: "https://api.060504.shop/azone/v1/discover"\n      request_params:\n        tags:\n          - arg: tag\n            string_convert: true\n          - arg: limit\n            number_convert: true\n  - name: getAgent\n    description:\n      en: Get detailed information about a specific AI agent\n      zh-cn: \u83b7\u53d6\u7279\u5b9a AI Agent \u7684\u8be6\u7ec6\u4fe1\u606f\n    parameters:\n      - name: azone_id\n        type: string\n        required: true\n        label:\n          en: Azone ID\n          zh-cn: Azone ID\n    return-type:\n      type: string\n      required: true\n    workflow:\n      http_method: GET\n      url: "https://api.060504.shop/azone/v1/agents/{azone_id}"\n      request_params:\n        path:\n          - arg: azone_id\n            type: string\n  - name: registerAgent\n    description:\n      en: Register a new AI agent on the Azone network\n      zh-cn: \u5728 Azone \u7f51\u7edc\u4e0a\u6ce8\u518c\u65b0\u7684 AI Agent\n    parameters:\n      - name: name\n        type: string\n        required: true\n        label:\n          en: Agent name\n          zh-cn: Agent\u540d\u79f0\n      - name: endpoint\n        type: string\n        required: true\n        label:\n          en: HTTP endpoint\n          zh-cn: HTTP\u7aef\u70b9\n      - name: description\n        type: string\n        required: false\n        label:\n          en: Description\n          zh-cn: \u63cf\u8ff0\n      - name: capabilities\n        type: string\n        required: false\n        label:\n          en: Capabilities\n          zh-cn: \u80fd\u529b\n    return-type:\n      type: string\n      required: true\n    workflow:\n      http_method: POST\n      url: "https://api.060504.shop/azone/v1/register"\n      request_params:\n        body:\n          - arg: name\n            type: string\n          - arg: endpoint\n            type: string\n          - arg: description\n            type: string\n          - arg: capabilities\n            type: string\n