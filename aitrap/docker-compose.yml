version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: azone_db
    environment:
      POSTGRES_USER: azone
      POSTGRES_PASSWORD: azone_secret
      POSTGRES_DB: azone_dev
    ports:
      - "5432:5432"
    volumes:
      - azone_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  azone_db_data:
