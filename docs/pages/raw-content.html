<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>raw-content · 原始数据 — AgentBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a2c3e;
            line-height: 1.6;
        }

        /* 深色 Hero Banner */
        .hero-wrap {
            background: linear-gradient(160deg, #0d2d44 0%, #0a5e8c 100%);
            padding: 44px 24px 40px;
            text-align: center;
        }
        .hero-wrap .big-icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .hero-wrap h1 { font-size: 28px; font-weight: 700; color: #ffffff; }
        .hero-wrap .sub { font-size: 16px; color: rgba(255,255,255,0.72); margin-top: 4px; }
        .hero-wrap .desc {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            max-width: 520px;
            margin: 10px auto 0;
            line-height: 1.65;
        }

        /* 正文区 */
        .body-wrap { padding: 36px 24px 60px; }
        .container { max-width: 760px; margin: 0 auto; }

        .status-box {
            background: #ffffff;
            border: 1px solid #dde6ee;
            border-radius: 10px;
            padding: 8px 24px;
            margin-bottom: 24px;
        }
        .status-box .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eef3f8;
            font-size: 14px;
        }
        .status-box .row:last-child { border-bottom: none; }
        .status-box .label { color: #6c757d; }
        .status-box .value { color: #1a2c3e; font-weight: 500; }
        .status-box .value code {
            background: #f0f4f8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: #0a5e8c;
        }
        .status-box .value a { color: #0a5e8c; text-decoration: none; }
        .status-box .value a:hover { text-decoration: underline; }
        .tag-green {
            display: inline-block;
            background: #e6f4ea;
            color: #1a6b3c;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        .back {
            display: inline-block;
            padding: 8px 22px;
            border-radius: 20px;
            border: 1px solid #0a5e8c;
            color: #0a5e8c;
            text-decoration: none;
            font-size: 14px;
            transition: 0.15s;
        }
        .back:hover { background: #e8f3fb; }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #6c757d;
            border-top: 1px solid #dde6ee;
            padding-top: 22px;
            margin-top: 28px;
        }
        .footer a { color: #0a5e8c; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .hero-wrap { padding: 32px 16px 28px; }
            .body-wrap { padding: 24px 16px 40px; }
        }
    </style>
</head>
<body>

<div class="hero-wrap">
    <span class="big-icon">🔹</span>
    <h1>raw-content</h1>
    <div class="sub">原始数据 · 机器抓取 · 按次计费</div>
    <div class="desc">未加工、未经人工审核的网页内容提取。适合 AI Agent 快速获取小红书、知乎、微信等平台当前发布的原文。</div>
</div>

<div class="body-wrap">
    <div class="container">

        <div class="status-box">
            <div class="row">
                <span class="label">端点</span>
                <span class="value"><code>POST /v1/fetch/dynamic</code></span>
            </div>
            <div class="row">
                <span class="label">价格</span>
                <span class="value">0.003 USDC（静态）/ 0.008 USDC（动态渲染）</span>
            </div>
            <div class="row">
                <span class="label">状态</span>
                <span class="value"><span class="tag-green">✅ 已上线</span></span>
            </div>
            <div class="row">
                <span class="label">文档</span>
                <span class="value">
                    <a href="/openapi.json" target="_blank">OpenAPI</a> ·
                    <a href="/llms.txt" target="_blank">llms.txt</a>
                </span>
            </div>
        </div>

        <a href="../index.html" class="back">← 返回首页</a>

        <div class="footer">
            <a href="https://github.com/tianzizhiming-svg/agentbridge" target="_blank">GitHub</a> · v2026.08.02
        </div>

    </div>
</div>

</body>
</html>
