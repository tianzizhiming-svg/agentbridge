        function loadData() {
            try {
                allProducts = EMBEDDED_DATA.products || [];
                render();
            } catch (err) {
                console.error('加载商品数据失败:', err);
                grid.innerHTML =
                    `<div class="empty-state"><span class="big-icon">⚠️</span><p>数据加载失败。</p><p style="font-size:13px;margin-top:4px;color:#94a3b8;">${err.message}</p></div>`;
            }
        }

        function getFiltered() {
            return allProducts.filter(p => {
                const matchType = currentType === 'all' || p.type === currentType;
                const matchDomain = currentDomain === 'all' || (p.domain && p.domain.includes(currentDomain));
                return matchType && matchDomain;
            });
        }

        function updateStats(filtered) {
            const total = allProducts.length;
            const industry = allProducts.filter(p => p.type === 'industry').length;
            const topic = allProducts.filter(p => p.type === 'topic').length;
            const guide = allProducts.filter(p => p.type === 'guide').length;
            const enterprise = allProducts.filter(p => p.type === 'enterprise').length;
            const audience = allProducts.filter(p => p.type === 'audience').length;
            const monitor = allProducts.filter(p => p.type === 'monitor').length;

            totalEl.textContent = total;
            countIndustry.textContent = industry;
            countTopic.textContent = topic;
            countGuide.textContent = guide;

            const others = [];
            if (enterprise) others.push(`🏢 ${enterprise}`);
            if (audience) others.push(`👥 ${audience}`);
            if (monitor) others.push(`📋 ${monitor}`);
            otherStats.textContent = others.join('  ·  ');

            footerCount.textContent = filtered.length;
        }

        function renderCards(products) {
            if (!products.length) {
                grid.innerHTML =
                    `<div class="empty-state"><span class="big-icon">🔍</span><p>没有匹配的知识产品</p><p style="font-size:13px;color:#94a3b8;">试试调整筛选条件</p></div>`;
                return;
            }

            let html = '';
            for (const p of products) {
                const typeIconMap = {
                    'industry': '📊',
                    'enterprise': '🏢',
                    'audience': '👥',
                    'topic': '📈',
                    'guide': '🧭',
                    'monitor': '📋'
                };
                const icon = typeIconMap[p.type] || '📄';

                const domainLabels = (p.domain_labels || []).join(' · ');
                const formatTags = (p.format || ['PDF']).map(f =>
                    `<span class="tag format">${f}</span>`
                ).join('');

                const statusClass = p.status === 'available' ? 'available' : '';
                const statusLabel = p.status === 'available' ? '✅ 已上线' : '⏳ 即将上线';
                const btnClass = p.status === 'available' ? 'btn-buy' : 'btn-buy coming';
                const btnText = p.status === 'available' ? '购买' : '即将上线';
                const priceDisplay = p.price < 0.01 ? '< 0.01' : p.price.toFixed(2);

                const tagsHtml = (p.tags || []).slice(0, 2).map(t =>
                    `<span class="tag">#${t}</span>`
                ).join('');

                html += `
                        <div class="product-card" data-id="${p.id}">
                            <div class="card-top">
                                <span class="type-icon">${icon}</span>
                                <span class="product-name">${p.name}</span>
                            </div>
                            <div class="product-desc">${p.description || ''}</div>
                            <div class="meta-row">
                                ${domainLabels ? `<span class="tag domain">${domainLabels}</span>` : ''}
                                ${formatTags}
                                <span class="tag status ${statusClass}">${statusLabel}</span>
                                ${tagsHtml}
                            </div>
                            <div class="card-footer">
                                <span class="price">${priceDisplay} <span class="currency">USDC</span></span>
                                <button class="${btnClass}" data-endpoint="${p.endpoint || ''}" ${p.status !== 'available' ? 'disabled' : ''}>
                                    ${btnText}
                                </button>
                            </div>
                        </div>
                    `;
            }
            grid.innerHTML = html;

            grid.querySelectorAll('.btn-buy:not(.coming)').forEach(btn => {
                btn.addEventListener('click', function() {
                    const endpoint = this.dataset.endpoint;
                    if (endpoint) {
                        window.location.href = `/docs#${endpoint}`;
                    } else {
                        alert('该商品暂未配置支付端点，请稍后再试。');
                    }
                });
            });
        }

        function render() {
            const filtered = getFiltered();
            updateStats(filtered);
            renderCards(filtered);
        }

        function bindFilters() {
            document.querySelectorAll('#typeFilters .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#typeFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentType = this.dataset.type;
                    render();
                });
            });

            document.querySelectorAll('#domainFilters .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#domainFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentDomain = this.dataset.domain;
                    render();
                });
            });
        }

        bindFilters();
        loadData();
    })();
</script>
